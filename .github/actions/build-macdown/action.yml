name: 'Build MacDown Archive'
description: 'Builds MacDown universal binary with optional code signing'
inputs:
  enable-signing:
    description: 'Enable code signing (true/false)'
    required: false
    default: 'false'
  team-id:
    description: 'Apple Team ID (required if signing enabled)'
    required: false
  marketing-version:
    description: 'Marketing version for CFBundleShortVersionString (e.g., 3000.0.0-beta.2)'
    required: false
    default: ''
  build-number:
    description: 'Build number for CFBundleVersion (e.g., 142)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Build MacDown archive
      shell: bash
      env:
        SIGNING_ENABLED: ${{ inputs.enable-signing }}
        MARKETING_VERSION_INPUT: ${{ inputs.marketing-version }}
        BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
        TEAM_ID_INPUT: ${{ inputs.team-id }}
        MACDOWN_RELEASE_VERSION: ${{ inputs.marketing-version }}
        MACDOWN_RELEASE_BUILD: ${{ inputs.build-number }}
      run: |
        echo "🔨 Building MacDown..."
        set -o pipefail

        # Build version settings (only if provided)
        VERSION_ARGS=()
        if [ -n "$MARKETING_VERSION_INPUT" ]; then
          VERSION_ARGS+=("MARKETING_VERSION=$MARKETING_VERSION_INPUT")
          echo "📌 Setting marketing version: $MARKETING_VERSION_INPUT"
        fi
        if [ -n "$BUILD_NUMBER_INPUT" ]; then
          VERSION_ARGS+=("CURRENT_PROJECT_VERSION=$BUILD_NUMBER_INPUT")
          echo "📌 Setting build number: $BUILD_NUMBER_INPUT"
        fi

        # Build with or without signing
        if [ "$SIGNING_ENABLED" == "true" ]; then
          echo "Building with code signing..."
          xcodebuild archive \
            -workspace "MacDown 3000.xcworkspace" \
            -scheme MacDown \
            -configuration Release \
            -archivePath build/MacDown.xcarchive \
            -arch arm64 -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$TEAM_ID_INPUT" \
            ENABLE_HARDENED_RUNTIME=YES \
            "${VERSION_ARGS[@]}" \
            | tee build.log
        else
          echo "Building without code signing (verification only)..."
          xcodebuild archive \
            -workspace "MacDown 3000.xcworkspace" \
            -scheme MacDown \
            -configuration Release \
            -archivePath build/MacDown.xcarchive \
            -arch arm64 -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${VERSION_ARGS[@]}" \
            | tee build.log
        fi

        echo "✅ Build completed"

    - name: Extract application bundle
      shell: bash
      run: |
        echo "📦 Extracting application bundle..."

        # Extract .app from archive
        cp -R build/MacDown.xcarchive/Products/Applications/"MacDown 3000.app" build/"MacDown 3000.app"

        # Display build info
        echo "Build contents:"
        ls -lh build/

        # Get version
        APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/"MacDown 3000.app"/Contents/Info.plist)
        echo "📌 App version: $APP_VERSION"
