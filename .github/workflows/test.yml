name: Tests

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    strategy:
      matrix:
        os: [macos-14, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    - name: Run native build and resource contract regressions
      timeout-minutes: 5
      run: |
        set -euo pipefail
        python3 MacDownTests/BuildTools/scripts_tests.py
        python3 MacDownTests/BuildTools/smoke_launch_tests.py
        python3 MacDownTests/BuildTools/stall_empty_suite_tests.py
        python3 MacDownTests/BuildTools/version_tests.py
        python3 MacDownTests/BuildTools/release_identity_tests.py
        python3 MacDownTests/BuildTools/staple_resume_tests.py
        python3 MacDownTests/BuildTools/staple_partial_upload_tests.py
        python3 MacDownTests/BuildTools/packaging_version_tests.py
        python3 MacDownTests/BuildTools/peg_contracts.py
        python3 MacDownTests/BuildTools/yaml_graph_tests.py
        python3 MacDownTests/BuildTools/command_queue_tests.py
        python3 MacDownTests/BuildTools/code_accessory_tests.py
        python3 MacDownTests/BuildTools/toc_hierarchy_tests.py
        python3 MacDownTests/BuildTools/quicklook_theme_tests.py
        python3 MacDownTests/BuildTools/quicklook_code_theme_tests.py
        python3 MacDownTests/BuildTools/community_theme_tests.py
        python3 MacDownTests/BuildTools/callout_tests.py
        python3 MacDownTests/BuildTools/heading_spacing_tests.py
        python3 MacDownTests/BuildTools/indent_selection_tests.py
        bash MacDownTests/UI/test_editor_geometry.sh
        bash MacDownTests/Localization/test_plural_rules.sh
        python3 MacDownTests/BuildTools/print_colors_tests.py
        python3 MacDownTests/Sandbox/preferences_tests.py
        python3 MacDownTests/Sandbox/assets_tests.py
        node MacDownTests/JavaScript/mermaid-init.test.js
        node MacDownTests/JavaScript/header-locations.test.js

    # The step timeout bounds the cost of a hung test host: a job-level timeout cancels the
    # remaining steps, so the diagnostic steps below would never run, whereas a step-level
    # one leaves them to fire on failure(). Healthy runs finish in about 2-4 minutes.
    - name: Run tests
      timeout-minutes: 8
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDown \
          -derivedDataPath DerivedData \
          -test-timeouts-enabled YES \
          -maximum-test-execution-time-allowance 120 \
          2>&1 | tee xcodebuild.log

    # A hung host produces no failure message of its own, only silence, so name the test
    # that was running when the log stopped. The last test to start having completed means
    # the failure was something other than a stall.
    - name: Report blocked tests
      if: failure()
      run: |
        log=xcodebuild.log
        [ -f "$log" ] || exit 0
        name=$(sed -n "s/.*Test Case '\(.*\)' started\..*/\1/p" "$log" | tail -1 || true)
        if [ -z "$name" ]; then
          echo "No test started; failed during setup or build." >> "$GITHUB_STEP_SUMMARY"
        elif grep -qF "Test Case '$name' passed" "$log" \
          || grep -qF "Test Case '$name' failed" "$log" \
          || grep -qF "Test Case '$name' errored" "$log"; then
          echo "Last test to start (\`$name\`) completed, so this was not a stall." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "\`$name\` started but never completed: it blocked." >> "$GITHUB_STEP_SUMMARY"
        fi
        grep -oE "Test Case '[^']*' exceeded execution time allowance" "$log" \
          | sed 's/^/- recovered by watchdog: /' >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          ~/Library/Logs/DiagnosticReports/
          DerivedData/Logs/Test/
          xcodebuild.log
        retention-days: 7
