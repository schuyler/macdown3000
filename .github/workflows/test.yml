name: Tests

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    strategy:
      matrix:
        os: [macos-14, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    # The four skipped tests each intermittently wedge the entire test host on GitHub's
    # runners: the run goes silent from the moment the test starts. Sometimes XCTest's
    # execution-time-allowance watchdog fires and recovers the suite; sometimes it fires
    # and the host still never resumes; sometimes it never reports at all. Which of those
    # happens varies run to run rather than by test, so none of them can be relied on to
    # fail cheaply. Observed on both macos-14 and macos-26, never reproduced locally.
    # All four still run locally, where they are reliable.
    #
    # A step-level timeout fails only this step, so the reporting and upload steps
    # below still run. A job-level timeout cancels them along with everything else.
    # Ten minutes clears the slowest observed run (183s) plus two 120s watchdog
    # recoveries.
    - name: Run tests
      timeout-minutes: 10
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDown \
          -derivedDataPath DerivedData \
          -test-timeouts-enabled YES \
          -maximum-test-execution-time-allowance 120 \
          -skip-testing:MacDownTests/MPResourceWatcherSetTests/testDelegateCalledOnAtomicSave \
          -skip-testing:MacDownTests/MPResourceWatcherSetTests/testWatcherReestablishedAfterAtomicSave \
          -skip-testing:MacDownTests/MPWordCountUpdateTests/testPendingUpdatesCancelledOnClose \
          -skip-testing:MacDownTests/MPPreviewViewControllerTests/testCompletionHandlerIsEventuallyCalledAfterNavigation \
          2>&1 | tee xcodebuild.log

    # A test that wedges the host emits "started." with no matching result line, and
    # produces no watchdog output to search for. Name it on the run summary so the
    # next stall doesn't have to be diagnosed by reading the raw log.
    - name: Report last test to start
      if: failure()
      run: |
        NAME=$(sed -n "s/.*Test Case '\(.*\)' started\..*/\1/p" xcodebuild.log 2>/dev/null | tail -1 || true)
        if [ -z "$NAME" ]; then
          echo "No test started; the run failed during setup or build." >> "$GITHUB_STEP_SUMMARY"
        elif grep -qF "Test Case '$NAME' passed" xcodebuild.log \
          || grep -qF "Test Case '$NAME' failed" xcodebuild.log \
          || grep -qF "Test Case '$NAME' errored" xcodebuild.log; then
          echo "Last test to start (\`$NAME\`) completed, so this was not a stall." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "\`$NAME\` started but never completed: it blocked." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          ~/Library/Logs/DiagnosticReports/
          DerivedData/Logs/Test/
          xcodebuild.log
        retention-days: 7
