name: Tests

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    strategy:
      matrix:
        os: [macos-14, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDown \
          -derivedDataPath DerivedData

    - name: Upload test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          ~/Library/Logs/DiagnosticReports/
          DerivedData/Logs/Test/
        retention-days: 7

  appcast-script:
    name: Appcast Script Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Stdlib only, and sign_update is stubbed, so this needs no Xcode, no
    # CocoaPods and no macOS. The tests that pin appcast element names against
    # the Sparkle framework binary skip when the pod is absent, as it is here.
    - name: Run appcast script tests
      run: python3 Tools/test_update_appcast.py
