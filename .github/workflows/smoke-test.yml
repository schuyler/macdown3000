name: Smoke Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # Keep in sync with the inline smoke test in release.yml
  launch-test:
    name: App Launch Test
    strategy:
      matrix:
        os: [macos-14, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    - name: Build MacDown
      run: |
        xcodebuild build \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDown \
          -configuration Debug \
          -derivedDataPath DerivedData

    - name: Test app launch (smoke test for issue #169)
      timeout-minutes: 2
      run: |
        APP_PATH="DerivedData/Build/Products/Debug/MacDown 3000.app"
        bash Tools/smoke_launch.sh "$APP_PATH"

  # Keep in sync with the inline UI test in release.yml
  ui-test:
    name: Run UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    - name: Run UI tests
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDownUITests \
          -derivedDataPath DerivedData \
          -resultBundlePath UITestResults.xcresult \
          -test-timeouts-enabled YES \
          -maximum-test-execution-time-allowance 120

    - name: Upload UI test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: |
          UITestResults.xcresult
          ~/Library/Logs/DiagnosticReports/
        retention-days: 7
