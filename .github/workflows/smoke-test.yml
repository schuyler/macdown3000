name: Smoke Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # Keep in sync with the inline smoke test in release.yml
  launch-test:
    name: App Launch Test
    strategy:
      matrix:
        os: [macos-14, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    - name: Build MacDown
      run: |
        xcodebuild build \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDown \
          -configuration Debug \
          -derivedDataPath DerivedData

    - name: Test app launch (smoke test for issue #169)
      timeout-minutes: 2
      run: |
        APP_PATH=$(find DerivedData -name "MacDown 3000.app" -type d | head -n 1)

        if [ -z "$APP_PATH" ]; then
          echo "ERROR: Could not find built MacDown 3000.app"
          exit 1
        fi

        echo "=== Found app at: $APP_PATH ==="

        # Test 1: Fresh install scenario (no legacy preferences)
        echo "=== Test 1: Fresh install (no preferences) ==="
        defaults delete com.uranusjr.macdown 2>/dev/null || true
        defaults delete app.macdown.macdown3000 2>/dev/null || true

        echo "Launching MacDown 3000 (will auto-quit after 5 seconds)..."
        open -W -n "$APP_PATH" &
        APP_PID=$!
        TIMEOUT=5
        ELAPSED=0
        TIMED_OUT=false
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if ! kill -0 $APP_PID 2>/dev/null; then
            break
          fi
          sleep 1
          ELAPSED=$((ELAPSED + 1))
        done
        if kill -0 $APP_PID 2>/dev/null; then
          kill $APP_PID 2>/dev/null
          TIMED_OUT=true
        fi
        EXIT_CODE=0
        wait $APP_PID 2>/dev/null || EXIT_CODE=$?
        if [ "$TIMED_OUT" = "true" ]; then
          echo "App launched successfully (killed after 5s timeout as expected)"
        elif [ $EXIT_CODE -eq 0 ]; then
          echo "App launched and exited cleanly"
        else
          echo "ERROR: App exited unexpectedly with code $EXIT_CODE - possible crash or hang"
          exit 1
        fi

        MIGRATION_COMPLETE=$(defaults read app.macdown.macdown3000 MPDidMigrateFromLegacyBundleIdentifier 2>/dev/null || echo "0")
        echo "Migration completed flag: $MIGRATION_COMPLETE"

        # Test 2: With legacy preferences (migration scenario)
        echo ""
        echo "=== Test 2: With legacy preferences (migration test) ==="
        defaults delete app.macdown.macdown3000 2>/dev/null || true
        defaults write com.uranusjr.macdown testMigrationKey "testMigrationValue"
        defaults write com.uranusjr.macdown editorBaseFontName "Monaco"

        echo "Created test legacy preferences"

        echo "Launching MacDown 3000 with legacy preferences (will auto-quit after 5 seconds)..."
        open -W -n -F "$APP_PATH" &
        APP_PID=$!
        TIMEOUT=5
        ELAPSED=0
        TIMED_OUT=false
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if ! kill -0 $APP_PID 2>/dev/null; then
            break
          fi
          sleep 1
          ELAPSED=$((ELAPSED + 1))
        done
        if kill -0 $APP_PID 2>/dev/null; then
          kill $APP_PID 2>/dev/null
          TIMED_OUT=true
        fi
        EXIT_CODE=0
        wait $APP_PID 2>/dev/null || EXIT_CODE=$?
        if [ "$TIMED_OUT" = "true" ]; then
          echo "App launched successfully with migration (killed after 5s timeout)"
        elif [ $EXIT_CODE -eq 0 ]; then
          echo "App launched with migration and exited cleanly"
        else
          echo "ERROR: App exited unexpectedly during migration with code $EXIT_CODE"
          exit 1
        fi

        MIGRATION_COMPLETE=$(defaults read app.macdown.macdown3000 MPDidMigrateFromLegacyBundleIdentifier 2>/dev/null || echo "0")
        if [ "$MIGRATION_COMPLETE" = "1" ]; then
          echo "Migration completed successfully"
        else
          echo "WARNING: Migration completed flag not set"
        fi

        defaults delete com.uranusjr.macdown 2>/dev/null || true
        defaults delete app.macdown.macdown3000 2>/dev/null || true

        echo ""
        echo "=== Launch test completed successfully on ${{ matrix.os }} ==="

  # Keep in sync with the inline UI test in release.yml
  ui-test:
    name: Run UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MacDown build environment
      uses: ./.github/actions/setup-macdown

    - name: Run UI tests
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace "MacDown 3000.xcworkspace" \
          -scheme MacDownUITests \
          -derivedDataPath DerivedData \
          -resultBundlePath UITestResults.xcresult \
          -test-timeouts-enabled YES \
          -maximum-test-execution-time-allowance 120

    - name: Upload UI test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: |
          UITestResults.xcresult
          ~/Library/Logs/DiagnosticReports/
        retention-days: 7
